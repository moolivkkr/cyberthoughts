<svg xmlns="http://www.w3.org/2000/svg" width="680" height="372" viewBox="0 0 680 372" role="img" font-family="'Helvetica Neue', Arial, sans-serif">
  <title>Option B: KMS direct signing architecture</title>
  <desc>A workload requests a certificate from a stateless CA service, which calls the KMS Sign API over a FIPS endpoint for every certificate; KMS HSMs are FIPS 140-3 Level 3 but a shared per-account crypto-operations quota and per-operation cost gate throughput.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { dominant-baseline: central; }
    .title { font-size: 14px; font-weight: 500; }
    .sub { font-size: 12px; font-weight: 400; }
    .lbl { font-size: 12px; font-weight: 400; fill: #73726C; }
    .arr { stroke: #73726C; stroke-width: 1.5; fill: none; }
    .leader { stroke: #B4B2A9; stroke-width: 0.8; stroke-dasharray: 3 3; }
  </style>

  <rect x="240" y="40" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="title" x="340" y="61" text-anchor="middle" fill="#085041">AWS KMS</text>
  <text class="sub" x="340" y="79" text-anchor="middle" fill="#0F6E56">L3 · via FIPS endpoint</text>

  <line x1="441" y1="68" x2="461" y2="68" class="leader"/>
  <rect x="462" y="46" width="170" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="sub" x="547" y="63" text-anchor="middle" fill="#633806">shared crypto-ops</text>
  <text class="sub" x="547" y="79" text-anchor="middle" fill="#633806">quota + per-op cost</text>

  <line x1="290" y1="148" x2="290" y2="100" class="arr" marker-end="url(#arrow)"/>
  <line x1="390" y1="100" x2="390" y2="148" class="arr" marker-end="url(#arrow)"/>

  <rect x="240" y="150" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="title" x="340" y="171" text-anchor="middle" fill="#2C2C2A">CA signing service</text>
  <text class="sub" x="340" y="189" text-anchor="middle" fill="#5F5E5A">calls KMS Sign / cert</text>

  <line x1="290" y1="258" x2="290" y2="210" class="arr" marker-end="url(#arrow)"/>
  <line x1="390" y1="210" x2="390" y2="258" class="arr" marker-end="url(#arrow)"/>

  <rect x="240" y="260" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="title" x="340" y="281" text-anchor="middle" fill="#2C2C2A">Workload (client)</text>
  <text class="sub" x="340" y="299" text-anchor="middle" fill="#5F5E5A">requests cert</text>

  <rect x="150" y="334" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="lbl" x="167" y="341" text-anchor="start">L3 hardware (managed)</text>
  <rect x="400" y="334" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="lbl" x="417" y="341" text-anchor="start">throughput constraint</text>
</svg>
