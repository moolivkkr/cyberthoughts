<svg xmlns="http://www.w3.org/2000/svg" width="680" height="392" viewBox="0 0 680 392" role="img" font-family="'Helvetica Neue', Arial, sans-serif">
  <title>Option E: Nitro Enclaves + AL2023 FIPS (hardened L1)</title>
  <desc>An L3 KMS root releases signing only to an attested image; the AL2023 FIPS signer (L1) runs inside a Nitro Enclave with hardware-isolated memory and issues SVIDs to workloads.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { dominant-baseline: central; }
    .title { font-size: 14px; font-weight: 500; }
    .sub { font-size: 12px; font-weight: 400; }
    .lbl { font-size: 12px; font-weight: 400; fill: #73726C; }
    .arr { stroke: #73726C; stroke-width: 1.5; fill: none; }
  </style>

  <!-- T1 root (teal / L3) -->
  <rect x="240" y="40" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="title" x="340" y="61" text-anchor="middle" fill="#085041">AWS KMS root</text>
  <text class="sub" x="340" y="79" text-anchor="middle" fill="#0F6E56">L3 · attestation-gated</text>

  <!-- attested access arrow -->
  <line x1="340" y1="98" x2="340" y2="144" class="arr" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
  <text class="lbl" x="352" y="122" text-anchor="start">attested access (PCR)</text>

  <!-- Nitro Enclave boundary -->
  <rect x="210" y="146" width="260" height="86" rx="10" fill="none" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="6 4"/>
  <text class="lbl" x="222" y="160" text-anchor="start">Nitro Enclave</text>

  <!-- signer (purple / L1) inside enclave -->
  <rect x="240" y="170" width="200" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="title" x="340" y="188" text-anchor="middle" fill="#3C3489">AL2023 FIPS signer</text>
  <text class="sub" x="340" y="206" text-anchor="middle" fill="#534AB7">L1 · isolated memory</text>

  <!-- request / response arrows -->
  <line x1="290" y1="268" x2="290" y2="234" class="arr" marker-end="url(#arrow)"/>
  <line x1="390" y1="234" x2="390" y2="268" class="arr" marker-end="url(#arrow)"/>

  <!-- T3 workload (gray) -->
  <rect x="240" y="270" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="title" x="340" y="291" text-anchor="middle" fill="#2C2C2A">Workload (client)</text>
  <text class="sub" x="340" y="309" text-anchor="middle" fill="#5F5E5A">requests SVID</text>

  <!-- legend -->
  <rect x="130" y="350" width="12" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="lbl" x="147" y="357" text-anchor="start">L3 root (KMS)</text>
  <rect x="300" y="350" width="12" height="12" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="lbl" x="317" y="357" text-anchor="start">L1 in enclave</text>
  <rect x="470" y="350" width="12" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="lbl" x="487" y="357" text-anchor="start">client</text>
</svg>
